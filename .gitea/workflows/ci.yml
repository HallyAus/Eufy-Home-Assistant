name: Eufy private-source matrix and rootless add-on build
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  test:
    runs-on: personal-ubuntu
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - python: '3.12'
          image: python:3.12-bookworm@sha256:5560e9ab8709f459489e5b8aa696eda8a07ef821e14bb122be62d91234bfa98b
        - python: '3.13'
          image: python:3.13-bookworm@sha256:073ffebb96ae4d0ed73ccad59f08c47bd84af8a79f5258130f8458ac50ad9ff4
        - python: '3.14'
          image: python:3.14-bookworm@sha256:7ee7e4d4fb42c3ad45b8fdc473b64ec69c3cf6e80ae5d52f6fa55f77fac29027
    container:
      image: ${{ matrix.image }}
    steps:
    - &id001
      name: Check out the exact private VM300 source
      env:
        SOURCE_TOKEN: ${{ secrets.GITEA_TOKEN }}
      shell: sh
      run: |
        set -eu
        test "$GITHUB_SERVER_URL" = 'http://192.168.1.130:3000'
        test "$GITHUB_REPOSITORY" = 'hallyaus/Eufy-Home-Assistant'
        test "$GITHUB_REF" = 'refs/heads/main'
        test -n "${SOURCE_TOKEN:?Repository job token required}"
        case "$GITHUB_SHA" in ''|*[!0-9a-f]*) exit 1;; esac
        test "${#GITHUB_SHA}" -eq 40
        command -v git >/dev/null || apk add --no-cache git
        helper="$(mktemp "${RUNNER_TEMP:-/tmp}/eufy-askpass.XXXXXX")"
        trap 'rm -f "$helper"' EXIT
        cat > "$helper" <<'ASKPASS'
        #!/bin/sh
        case "$1" in
          *Username*) printf '%s\n' 'x-access-token' ;;
          *Password*) printf '%s\n' "$SOURCE_TOKEN" ;;
          *) exit 1 ;;
        esac
        ASKPASS
        chmod 700 "$helper"
        export GIT_ASKPASS="$helper" GIT_TERMINAL_PROMPT=0
        git init .
        git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
        git -c credential.helper= fetch --no-tags --depth=1 origin "$GITHUB_SHA"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
    - name: Original full Python matrix and hardening inventory
      shell: sh
      run: |
        set -eu
        python -m pip install --disable-pip-version-check -r bridge/requirements.txt pytest==9.0.2 pytest-asyncio==1.3.0 pyyaml==6.0.3
        python -c 'import aiohttp, aiortc, av, cryptography, Crypto, websockets'
        for file in test_hardening_generator.py test_hardening_api.py test_hardening_snapshot.py test_eufy_supervisor.py; do test -f "tests/$file"; done
        python -m pytest -q tests
        python -m compileall -q bridge custom_components tests
        bash -n eufy_nvr/run.sh
        bash -n bridge/start_bridge.sh
  static:
    needs:
    - test
    runs-on: personal-ubuntu
    container:
      image: node:24-bookworm@sha256:14078204b6bb268c107ceff6d3c43f45a888105e5c2b18b14c32b3409d93a1b0
    timeout-minutes: 15
    steps:
    - *id001
    - name: Original JavaScript checks and exact-source context regression
      shell: sh
      run: |
        set -eu
        node --check bridge/sctp_oracle.js
        node --check bridge/fetch_deps.js
        node --check bridge/get_auth.js
        python3 .gitea/scripts/test_oci_context.py
        python3 .gitea/scripts/test_private_oci.py
  addon-build:
    needs:
    - test
    - static
    runs-on: personal-oci
    timeout-minutes: 60
    steps:
    - *id001
    - name: Build exact VM300 add-on source with the personal rootless mTLS builder
      shell: bash
      env:
        BUILDKIT_CA: ${{ secrets.BUILDKIT_CA }}
        BUILDKIT_CLIENT_CERT: ${{ secrets.BUILDKIT_CLIENT_CERT }}
        BUILDKIT_CLIENT_KEY: ${{ secrets.BUILDKIT_CLIENT_KEY }}
      run: |
        set -euo pipefail
        test -n "${BUILDKIT_CA:?Repository-only personal builder CA required}"
        test -n "${BUILDKIT_CLIENT_CERT:?Repository-only personal builder client certificate required}"
        test -n "${BUILDKIT_CLIENT_KEY:?Repository-only personal builder client key required}"
        buildctl --version | grep -F 'v0.34.0' >/dev/null
        node -e 'if(process.versions.node.split(".")[0]!=="24")process.exit(1)'
        umask 077
        tls_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/eufy-buildkit.XXXXXX")"
        trap 'rm -f "$tls_dir/ca.pem" "$tls_dir/client.pem" "$tls_dir/key.pem"; rmdir "$tls_dir"' EXIT
        printf '%s\n' "$BUILDKIT_CA" > "$tls_dir/ca.pem"
        printf '%s\n' "$BUILDKIT_CLIENT_CERT" > "$tls_dir/client.pem"
        printf '%s\n' "$BUILDKIT_CLIENT_KEY" > "$tls_dir/key.pem"
        unset BUILDKIT_CA BUILDKIT_CLIENT_CERT BUILDKIT_CLIENT_KEY
        openssl verify -CAfile "$tls_dir/ca.pem" "$tls_dir/client.pem" >/dev/null
        openssl x509 -in "$tls_dir/client.pem" -noout -checkend 3600 >/dev/null
        openssl x509 -in "$tls_dir/client.pem" -noout -subject -nameopt RFC2253 | grep -Fx 'subject=CN=hallyaus-Eufy-Home-Assistant' >/dev/null
        python3 .gitea/scripts/prepare_oci_context.py
        buildctl --addr tcp://172.17.0.1:1234 --tlsservername buildkit-personal --tlscacert "$tls_dir/ca.pem" --tlscert "$tls_dir/client.pem" --tlskey "$tls_dir/key.pem" build \
          --frontend dockerfile.v0 --local context=dist/eufy-build-context --local dockerfile=dist/eufy-build-context \
          --opt platform=linux/amd64 --output type=oci,dest=dist/eufy-addon-amd64.oci.tar --metadata-file dist/build-metadata.json
        test -s dist/eufy-addon-amd64.oci.tar
        sha256sum dist/eufy-addon-amd64.oci.tar > dist/eufy-addon-amd64.sha256
        git diff --exit-code
    - name: Publish the verified candidate to the private personal Gitea registry
      shell: bash
      env:
        PERSONAL_PACKAGE_TOKEN: ${{ secrets.PERSONAL_PACKAGE_TOKEN }}
      run: python3 .gitea/scripts/publish_private_oci.py
    - name: Retain private OCI candidate and exact-source proof
      uses: https://github.com/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
      with:
        name: eufy-amd64-${{ github.sha }}
        path: |-
          dist/eufy-addon-amd64.oci.tar
          dist/eufy-addon-amd64.sha256
          dist/source-provenance.json
          dist/build-metadata.json
          dist/private-registry-publication.json
        if-no-files-found: error
        retention-days: 3
