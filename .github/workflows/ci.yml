name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install -r bridge/requirements.txt \
            pytest==9.0.2 pytest-asyncio==1.3.0 pyyaml==6.0.3
      - name: Import runtime dependencies
        run: python -c "import aiohttp, aiortc, av, cryptography, Crypto, websockets"
      - name: Run tests
        run: python -m pytest -q tests
      - name: Compile Python
        run: python -m compileall -q bridge custom_components tests
      - name: Validate shell and JavaScript syntax
        run: |
          bash -n eufy_nvr/run.sh
          bash -n bridge/start_bridge.sh
          node --check bridge/sctp_oracle.js
          node --check bridge/fetch_deps.js
          node --check bridge/get_auth.js

  addon-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build amd64 Home Assistant add-on image
        run: |
          docker build \
            --tag eufy-nvr:ci \
            --file eufy_nvr/Dockerfile \
            eufy_nvr
          test "$(docker run --rm --entrypoint node eufy-nvr:ci --version)" = "v22.23.4"
          test "$(docker run --rm --entrypoint cat eufy-nvr:ci /opt/eufy/build-info/node-version.txt)" = "v22.23.4"
          test "$(docker run --rm --entrypoint cat eufy-nvr:ci /opt/eufy/build-info/bridge-revision.txt)" = "b3ee602a359529d59a41a11b7d160be7219d385a"
          docker run --rm --workdir /opt/eufy --entrypoint sha256sum eufy-nvr:ci -c build-info/bridge.sha256
          diff -u <(find bridge -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) \
            <(docker run --rm --entrypoint cat eufy-nvr:ci /opt/eufy/build-info/bridge.sha256)
