name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r bridge/requirements.txt \
            pytest==9.0.2 pytest-asyncio==1.3.0 pyyaml==6.0.3
      - name: Import runtime dependencies
        run: python -c "import aiohttp, aiortc, av, cryptography, Crypto, websockets"
      - name: Run tests
        run: python -m pytest -q tests
      - name: Compile Python
        run: python -m compileall -q bridge custom_components tests
      - name: Validate shell and JavaScript syntax
        run: |
          bash -n eufy_nvr/run.sh
          bash -n bridge/start_bridge.sh
          node --check bridge/sctp_oracle.js
          node --check bridge/fetch_deps.js
          node --check bridge/get_auth.js

  addon-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bridge-source: [pinned, checkout]
    env:
      BRIDGE_SOURCE: ${{ matrix.bridge-source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify amd64 Home Assistant add-on image
        shell: bash
        run: |
          dockerfile=eufy_nvr/Dockerfile
          build_args=()
          if [[ "$BRIDGE_SOURCE" == checkout ]]; then
            expected="$(git rev-parse HEAD)"
            test "$expected" = "$GITHUB_SHA"
            build_args+=(--build-arg "REPO_COMMIT=$expected")
          else
            expected="$(sed -nE 's/^ARG REPO_COMMIT="([0-9a-f]{40})"$/\1/p' "$dockerfile")"
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]]
          docker build "${build_args[@]}" --tag eufy-nvr:ci --file "$dockerfile" eufy_nvr
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' eufy-nvr:ci)" = "$expected"
          test "$(docker run --rm --entrypoint node eufy-nvr:ci --version)" = "v22.23.4"
          if [[ "$BRIDGE_SOURCE" == checkout ]]; then
            git ls-files -z -- bridge/ | xargs -0 sha256sum |
              docker run --rm -i --workdir /opt/eufy --entrypoint sha256sum eufy-nvr:ci --check --strict
          fi
