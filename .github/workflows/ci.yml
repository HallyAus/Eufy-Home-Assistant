name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt pytest pytest-asyncio pyyaml
      - name: Import runtime dependencies
        run: python -c "import aiohttp, aiortc, av, cryptography, Crypto, websockets"
      - name: Run tests
        run: python -m pytest -q tests
      - name: Compile Python
        run: python -m compileall -q bridge custom_components tests
      - name: Validate shell and JavaScript syntax
        run: |
          bash -n eufy_nvr/run.sh
          bash -n bridge/start_bridge.sh
          node --check bridge/sctp_oracle.js
