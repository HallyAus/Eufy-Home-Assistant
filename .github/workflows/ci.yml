name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r bridge/requirements.txt \
            pytest==9.0.2 pytest-asyncio==1.3.0 pyyaml==6.0.3
      - name: Import runtime dependencies
        run: python -c "import aiohttp, aiortc, av, cryptography, Crypto, websockets"
      - name: Run tests
        run: python -m pytest -q tests
      - name: Compile Python
        run: python -m compileall -q bridge custom_components tests
      - name: Validate shell and JavaScript syntax
        run: |
          bash -n eufy_nvr/run.sh
          bash -n bridge/start_bridge.sh
          node --check bridge/sctp_oracle.js
          node --check bridge/fetch_deps.js
          node --check bridge/get_auth.js

  addon-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build amd64 Home Assistant add-on image
        run: |
          docker build \
            --file eufy_nvr/Dockerfile \
            eufy_nvr
