name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pyyaml cryptography
      - name: Run tests
        run: python -m pytest -q tests
      - name: Compile Python
        run: python -m compileall -q bridge custom_components tests
      - name: Validate shell and JavaScript syntax
        run: |
          bash -n eufy_nvr/run.sh
          bash -n bridge/start_bridge.sh
          node --check bridge/sctp_oracle.js
