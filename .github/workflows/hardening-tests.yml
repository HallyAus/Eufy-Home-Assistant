name: Hardening regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install -r bridge/requirements.txt
          pytest==9.0.2 pytest-asyncio==1.3.0 pyyaml==6.0.3
      - name: Run hardening regression suite
        run: >-
          pytest -q
          tests/test_hardening_generator.py
          tests/test_hardening_api.py
          tests/test_hardening_snapshot.py
          tests/test_eufy_supervisor.py
