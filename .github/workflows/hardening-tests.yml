name: Hardening regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-asyncio pyyaml aiohttp
      - name: Run hardening regression suite
        run: >-
          pytest -q
          tests/test_hardening_generator.py
          tests/test_hardening_api.py
          tests/test_hardening_snapshot.py
          tests/test_eufy_supervisor.py
