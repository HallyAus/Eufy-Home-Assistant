version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/eufy_nvr"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # The add-on deliberately runs the patched Node LTS line that
      # tests/test_release_packaging.py pins; change Node majors as a planned runtime move.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/bridge"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Australia/Sydney"
    open-pull-requests-limit: 5
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
