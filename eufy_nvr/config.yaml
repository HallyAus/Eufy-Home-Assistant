name: Eufy NVR Local (experimental)
version: "0.7.15"
slug: eufy_nvr
description: Local live video from a eufy PoE NVR (S4 / T8N00) over reversed WebRTC, served as RTSP/WebRTC for Home Assistant. No cloud media, no Frigate.
url: https://github.com/HallyAus/Eufy-Home-Assistant
arch:
  - aarch64
  - amd64
init: false
# "application" = long-running service that HA keeps up; pairs with the watchdog below.
startup: application
boot: auto

# host_network is REQUIRED: the engine talks LAN-direct to the NVR (WebRTC media + UDP), and
# go2rtc must be reachable on the HA host's LAN address by HA Core / Generic Camera.
# With host_network the ports below are informational (no NAT is applied), but we
# keep them so the Supervisor UI documents what the add-on opens.
host_network: true

# Watchdog: Supervisor pings this TCP endpoint; if go2rtc's API stops answering, the add-on is
# restarted. run.sh ALSO has its own supervise loop (restart-on-crash) so transient engine
# failures recover in-process without a full container bounce.
watchdog: "tcp://[HOST]:[PORT:1985]"

# Ingress points the "Open Web UI" button at go2rtc's built-in UI (stream list + WebRTC test player).
ingress: false
panel_icon: mdi:cctv
webui: "http://[HOST]:[PORT:1985]/"

ports:
  8556/tcp: 8556
  1985/tcp: 1985
  8557/tcp: 8557
  8557/udp: 8557
ports_description:
  8556/tcp: RTSP (HA pulls cameras from rtsp://<HA-LAN-IP>:8556/eufy_<name>)
  1985/tcp: go2rtc API / web UI (also the watchdog endpoint)
  8557/tcp: WebRTC (TCP candidate)
  8557/udp: WebRTC (UDP candidate)

# --- Auth: headless email/password login (no token paste) ---------------------
# IMPORTANT: use the eufy account that OWNS/administers the NVR. Shared/member accounts can
# authenticate and resolve the station but the NVR may reject control commands with status -104.
# run.sh runs auth_login.py, which logs into the eufy passport (reversed ECDH+AES login --
# the body's password is ECDH/AES-256-CBC encrypted and the whole request rides the openapi
# ECDH share-key wrapper; see bridge/eufy_cloud.py), derives the NVR station_sn from the
# station list, and writes auth.json. Credentials live only in the add-on options + an
# in-container auth.json (chmod 600) and are never logged.
#   region         -- eufy SERVER region your account lives on: US | EU | IE (default US).
#   country        -- OPTIONAL account country code (e.g. AU, NZ, CA). Leave blank to use the
#                     region as the country. Set this if your account is registered outside
#                     US/EU/IE (e.g. AU) — it authenticates against the chosen region server
#                     while identifying your real country. Try region US first if unsure.
#   station_sn     -- optional: set if auto-discovery can't find the NVR serial.
#   captcha_id / captcha_answer -- optional: only if a login is challenged with a graphic
#                     captcha (the log prints the captcha_id; solve it and set both, restart).
#   verification_code -- optional one-time six-digit email code. On a device-verification
#                     challenge, the first start requests the code; enter it and restart.
#   go2rtc_username / go2rtc_password -- REQUIRED local credentials shared with the HACS
#                     integration. They protect the API, web UI, RTSP, and camera video.
options:
  email: ""
  password: ""
  region: "US"
  country: ""
  signaling_mode: "call"
  log_level: "info"
  keep_warm: false
  adaptive_warm_seconds: 30
  token_refresh_hours: 6
  video_copy: false
  verification_code: ""
  go2rtc_username: "eufy"
  go2rtc_password: ""
schema:
  email: str
  password: password
  region: list(US|EU|IE)?
  country: str?
  # Native call is required by T8N00 firmware that times out the newer compact scall mode.
  signaling_mode: list(call|scall)?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  # keep_warm: deprecated compatibility switch. When true, retains only the last-viewed camera
  #   for 300 seconds; it never starts one permanent producer per camera.
  keep_warm: bool?
  # adaptive_warm_seconds: retain the most recently viewed camera after its last consumer so
  #   reopening is instant. A different camera preempts it. Set 0 to disable; maximum 600.
  adaptive_warm_seconds: int(0,600)?
  # token_refresh_hours: how often to re-login and refresh auth.json (the eufy token is ~1-day).
  token_refresh_hours: int(0,)?
  # video_copy: publish raw H.265 instead of transcoding to H.264 (lower CPU, but the browser live
  #   view shows the still thumbnail only). The adaptive warmer itself never adds a transcode.
  video_copy: bool?
  station_sn: str?
  captcha_id: str?
  captcha_answer: str?
  verification_code: password?
  go2rtc_username: str
  go2rtc_password: password
