name: Eufy NVR Local (experimental)
version: "0.7.0"
slug: eufy_nvr
description: Local live video from a eufy PoE NVR (S4 / T8N00) over reversed WebRTC, served as RTSP/WebRTC for Home Assistant. No cloud media, no Frigate.
url: https://github.com/HallyAus/Eufy-Home-Assistant
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
host_network: true
watchdog: "tcp://[HOST]:[PORT:1985]"
ingress: false
panel_icon: mdi:cctv
webui: "http://[HOST]:[PORT:1985]/"

ports:
  8556/tcp: 8556
  1985/tcp: 1985
  8557/tcp: 8557
  8557/udp: 8557
ports_description:
  8556/tcp: RTSP (HA pulls cameras from rtsp://<HA-LAN-IP>:8556/eufy_<name>)
  1985/tcp: go2rtc API / web UI (also the watchdog endpoint)
  8557/tcp: WebRTC (TCP candidate)
  8557/udp: WebRTC (UDP candidate)

options:
  email: ""
  password: ""
  region: "US"
  country: ""
  log_level: "info"
  keep_warm: false
  token_refresh_hours: 6
  video_copy: false
schema:
  email: str
  password: password
  region: list(US|EU|IE)?
  country: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  keep_warm: bool?
  token_refresh_hours: int(0,)?
  video_copy: bool?
  station_sn: str?
  captcha_id: str?
  captcha_answer: str?
